<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PopTube Kids</title>
<style>
  /* Fonts setup - Google fonts link */
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap');

  /* Theme color palette */
  :root {
    --color-yellow: #FFC93C;
    --color-pink: #FF5C8A;
    --color-blue: #3FC1E0;
    --color-green: #5BD87A;
    --color-purple: #8C6BF0;
    --color-bg-cream: #FFF8EC;
    --color-dark-text: #3A2E52;
    --color-white: #ffffff;
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
  }

  body {
    font-family: 'Nunito', sans-serif;
    /* Fun colorful background gradients */
    background:
      radial-gradient(circle at 8% 15%, rgba(255,201,60,0.35) 0, transparent 40%),
      radial-gradient(circle at 92% 10%, rgba(140,107,240,0.25) 0, transparent 38%),
      radial-gradient(circle at 85% 90%, rgba(91,216,122,0.3) 0, transparent 40%),
      var(--color-bg-cream);
    color: var(--color-dark-text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ================= NAV BAR STYLES ================= */
  .navbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 28px;
    background: var(--color-white);
    border-bottom: 6px solid var(--color-yellow);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 26px;
    color: var(--color-pink);
    flex-shrink: 0;
  }

  /* Logo icon shape styling */
  .logo-mark {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--color-blue), var(--color-purple));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    transform: rotate(-6deg);
  }

  /* Play arrow inside the logo */
  .logo-mark::after {
    content: "";
    width: 0; 
    height: 0;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    border-left: 14px solid var(--color-white);
    margin-left: 4px;
  }

  .logo span.sub {
    color: var(--color-purple);
  }

  /* Search Area */
  .search-wrap {
    flex: 1;
    min-width: 200px;
    display: flex;
    justify-content: center;
  }

  .search-bar {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 480px;
    background: var(--color-bg-cream);
    border: 3px solid var(--color-blue);
    border-radius: 999px;
    padding: 8px 8px 8px 22px;
    gap: 10px;
  }

  .search-bar input {
    border: none;
    background: transparent;
    outline: none;
    flex: 1;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--color-dark-text);
  }

  .search-bar input::placeholder {
    color: #9c8fbd;
    font-weight: 700;
  }

  .search-btn {
    border: none;
    background: var(--color-pink);
    color: var(--color-white);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 3px 0 #d43d6a;
    transition: transform 0.15s ease;
  }
  
  .search-btn:hover { 
    transform: scale(1.08); 
  }
  
  .search-btn:active { 
    transform: translateY(2px); 
    box-shadow: 0 1px 0 #d43d6a; 
  }

  /* Nav Right Actions */
  .nav-actions {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    color: var(--color-white);
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    transition: transform 0.15s ease;
  }
  
  .icon-btn:hover { 
    transform: translateY(-2px); 
  }
  
  .icon-btn.profile { background: var(--color-green); }
  .icon-btn.parent { background: var(--color-purple); }

  /* ================= TOP CATEGORIES ================= */
  .categories {
    display: flex;
    gap: 12px;
    padding: 20px 28px 4px;
    overflow-x: auto;
  }

  .pill {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 22px;
    border-radius: 999px;
    white-space: nowrap;
    color: var(--color-white);
    cursor: pointer;
    border: none;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  }
  
  /* Setting colors manually for each category button */
  .pill:nth-child(1) { background: var(--color-pink); }
  .pill:nth-child(2) { background: var(--color-blue); }
  .pill:nth-child(3) { background: var(--color-green); }
  .pill:nth-child(4) { background: var(--color-yellow); color: var(--color-dark-text); }
  .pill:nth-child(5) { background: var(--color-purple); }

  /* ================= VIDEO GRID AREA ================= */
  .gallery-heading {
    font-family: 'Baloo 2', sans-serif;
    font-size: 28px;
    font-weight: 800;
    padding: 28px 28px 4px;
    color: var(--color-dark-text);
  }

  .gallery-heading span {
    display: inline-block;
    transform: rotate(-4deg);
    color: var(--color-pink);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 28px;
    padding: 20px 28px;
  }

    background: var(--color-white);
    border-radius: 24px;
    padding
